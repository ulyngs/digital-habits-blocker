# Automated dependency updates. Dependabot opens pull requests only; every
# update still goes through the normal review and CI checks.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates

version: 2
updates:
  # --- Frontend ---
  # `npm` is Dependabot's name for the whole Node ecosystem; it reads
  # pnpm-lock.yaml. There is no separate "pnpm" value.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps"
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Rust backend and local Tauri plugins ---
  - package-ecosystem: "cargo"
    directories:
      - "/src-tauri"
      - "/tauri-plugin-android-blocker"
      - "/tauri-plugin-screentime"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(rust)"
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- Android app and plugin Gradle projects ---
  - package-ecosystem: "gradle"
    directories:
      - "/src-tauri/gen/android"
      - "/src-tauri/gen/android/app"
      - "/src-tauri/gen/android/buildSrc"
      - "/tauri-plugin-android-blocker/android"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "deps(android)"
    ignore:
      # The Kotlin Gradle plugin is capped at 2.2.x by Tauri, not by us.
      # `tauri`'s own `mobile/android/build.gradle.kts` (vendored in the cargo
      # registry, so unpatchable from here) still uses the `kotlinOptions {}` /
      # `jvmTarget` DSL, which KGP 2.3 raised from a deprecation warning to a
      # hard script-compilation error. Any bump to >= 2.3 fails Android CI at
      # configuration time, before a single source file is compiled. Lift this
      # once Tauri migrates that script to the `compilerOptions` DSL.
      - dependency-name: "org.jetbrains.kotlin:kotlin-gradle-plugin"
        versions: [">=2.3.0"]
    groups:
      gradle-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # --- GitHub Actions ---
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns:
          - "*"
