# PR checks: build the frontend bundle and run the Tier 1 logic suite headlessly.
# The Android debug build lives in android-ci.yml so frontend-only and desktop-
# only PRs do not pay for the Android toolchain.
name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Compiles the whole src/ ES-module graph and the index.html entry.
      # Fails on syntax errors, duplicate declarations, unresolved imports.
      - run: npm run vite:build

  tier1:
    name: Tier 1 logic tests (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Boots the Vite dev server, runs runBlockingTests() in headless
      # Chromium, fails on any failed assertion or a mid-suite crash.
      - run: npm run test:tier1
