# Build signed macOS + Windows installers + iOS IPA, then publish from the same artifacts.
#
# One workflow run builds once; the publish job uploads those exact files to
# S3 and/or attaches them to a GitHub Release (optional checkboxes on manual runs).
# A separate job submits Store MSIX to Partner Center (independent of S3/GitHub),
# and another submits the iOS IPA to App Store Connect (What's new from the
# iOS-facing changelog bullets — see docs/app-store-ci.md).
#
# S3 layout matches redd-next download links (ReDDBlockClient.tsx):
#   s3://redd-website-assets/reddblock/Digital-Habits-Blocker-{version}.pkg
#   s3://redd-website-assets/reddblock/Digital-Habits-Blocker_{version}_x64-setup.exe
#   s3://redd-website-assets/reddblock/Digital-Habits-Blocker_{version}_arm64-setup.exe
#
# Trigger: Actions → "Release build" → Run workflow, or push tag v* (e.g. v3.1.10).
# Manual inputs:
#   upload_to_s3            — push installers to S3 (default: true)
#   create_github_release   — create GitHub Release from changelog.md (default: false)
#   submit_microsoft_store  — submit MSIX to Partner Center (default: true)
#   submit_app_store        — submit IPA to App Store Connect (default: true)
#   ios_build_number        — override CFBundleVersion (only for re-uploading the
#                             same version after a failed App Store run)
# Tag pushes always upload to S3, create a GitHub Release, and submit to both Stores.
#
# Before shipping: bump version, add ## vX.Y.Z to changelog.md, commit to main.
# Store CI setup: docs/microsoft-store-ci.md
#
# ── GitHub secrets (same AWS names as redd-api) ──
#   AWS_ACCESS_KEY_ID
#   AWS_SECRET_ACCESS_KEY
#   AWS_REGION                  eu-north-1
#   S3_ASSETS_BUCKET            redd-website-assets
#
# ── macOS signing ──
#   APPLE_CERTIFICATE_BASE64       Developer ID Application .p12 (base64)
#   APPLE_CERTIFICATE_PASSWORD
#   KEYCHAIN_PASSWORD
#   APPLE_DEVELOPER_INSTALLER_IDENTITY
#                                  "Developer ID Installer: Reduce Digital Distraction Ltd (JD647S9RT6)"
#   APPLE_INSTALLER_CERTIFICATE_BASE64   (if Installer was exported as a separate .p12)
#   APPLE_INSTALLER_CERTIFICATE_PASSWORD (optional; defaults to APPLE_CERTIFICATE_PASSWORD)
#   APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID
#
# ── Windows signing (same as local .env) ──
#   AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID
#
# ── Windows Store package identity (same as local .env) ──
#   WINDOWS_IDENTITY_NAME
#   WINDOWS_PUBLISHER
#   WINDOWS_PUBLISHER_DISPLAY_NAME
#
# ── Microsoft Store Partner Center submit (see docs/microsoft-store-ci.md) ──
#   AZURE_AD_TENANT_ID
#   AZURE_AD_APPLICATION_CLIENT_ID
#   AZURE_AD_APPLICATION_SECRET
#   SELLER_ID
#   MS_STORE_PRODUCT_ID
#
# ── App Store Connect submit (see docs/app-store-ci.md) ──
#   APP_STORE_CONNECT_API_KEY_ID          API Key ID (Users and Access → Integrations)
#   APP_STORE_CONNECT_API_ISSUER_ID       Issuer ID
#   APP_STORE_CONNECT_API_KEY_P8          base64 of the AuthKey_*.p8 private key

name: Release build

on:
  workflow_dispatch:
    inputs:
      upload_to_s3:
        description: Upload installers to S3 after a successful build
        type: boolean
        default: true
      create_github_release:
        description: Create a GitHub Release (notes from changelog.md)
        type: boolean
        default: false
      submit_microsoft_store:
        description: Submit Store MSIX to Partner Center (What's new from changelog)
        type: boolean
        default: true
      submit_app_store:
        description: Submit iOS IPA to App Store Connect (What's new from changelog)
        type: boolean
        default: true
      ios_build_number:
        description: Override iOS CFBundleVersion (only to re-upload the same version)
        type: string
        default: ''
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CI: true
  AWS_REGION: ${{ secrets.AWS_REGION }}
  S3_ASSETS_BUCKET: ${{ secrets.S3_ASSETS_BUCKET }}
  S3_RELEASE_PREFIX: reddblock/

jobs:
  build-mac:
    name: macOS (.pkg)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Safari bridge dylib
        run: bash ./scripts/build-safari-bridge.sh

      - name: Import Apple signing certificates
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_BASE64 }}
          APPLE_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_PASSWORD }}
          APPLE_DEVELOPER_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_INSTALLER_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: bash ./scripts/import-apple-certs-for-ci.sh

      - name: Build signed .app + .pkg
        env:
          APPLE_DEVELOPER_INSTALLER_IDENTITY: ${{ secrets.APPLE_DEVELOPER_INSTALLER_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_NOTARIZE_USER: ${{ secrets.APPLE_ID }}
          APPLE_NOTARIZE_PASS: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Installer identities before build:"
          security find-identity -v "$KEYCHAIN_PATH" | grep "Developer ID Installer" || true
          npm run build:mac-all

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: macos-installer
          path: for-distribution/Digital-Habits-Blocker-*.pkg
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Install trusted-signing-cli
        shell: pwsh
        run: |
          $bin = Join-Path $env:USERPROFILE '.cargo\bin\trusted-signing-cli.exe'
          if (-not (Test-Path $bin)) {
            cargo install trusted-signing-cli --locked
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')

      - name: Locate SignTool
        shell: pwsh
        run: |
          $signtool = Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw 'SignTool.exe not found on runner — Windows SDK may be missing.'
          }
          "TAURI_WINDOWS_SIGNTOOL_PATH=$($signtool.FullName)" >> $env:GITHUB_ENV
          Write-Host "SignTool: $($signtool.FullName)"

      - name: Build signed installers
        shell: pwsh
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        run: npm run build:win

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            for-distribution/Digital-Habits-Blocker_*-setup.exe
            for-distribution/Digital-Habits-Blocker_*.msi
          if-no-files-found: error
          retention-days: 30

  build-windows-store:
    name: Windows Store (.msix)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Microsoft Store packages
        shell: pwsh
        env:
          WINDOWS_IDENTITY_NAME: ${{ secrets.WINDOWS_IDENTITY_NAME }}
          WINDOWS_PUBLISHER: ${{ secrets.WINDOWS_PUBLISHER }}
          WINDOWS_PUBLISHER_DISPLAY_NAME: ${{ secrets.WINDOWS_PUBLISHER_DISPLAY_NAME }}
        run: npm run build:win-store

      - name: Upload Windows Store artifacts
        uses: actions/upload-artifact@v7
        with:
          name: windows-store-packages
          path: |
            for-distribution/x86_64-pc-windows-msvc/*.msix
            for-distribution/aarch64-pc-windows-msvc/*.msix
          if-no-files-found: error
          retention-days: 30

  build-ios:
    name: iOS (.ipa)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for App Store signing/submit: ${missing[*]}. See docs/app-store-ci.md." >&2
            exit 1
          fi

      - name: Write App Store Connect API key
        env:
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          mkdir -p "$HOME/.appstoreconnect"
          echo "$APP_STORE_CONNECT_API_KEY_P8" | base64 --decode > "$HOME/.appstoreconnect/AuthKey.p8"

      - name: Stamp iOS version
        run: node scripts/sync-ios-version.mjs --build-number "${{ inputs.ios_build_number || '' }}"

      - name: Build App Store IPA
        env:
          APPLE_API_ISSUER: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APPLE_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
        run: |
          export APPLE_API_KEY_PATH="$HOME/.appstoreconnect/AuthKey.p8"
          npm run build:ios

      - name: Stage IPA for publish
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mv "for-distribution/Digital Habits Blocker.ipa" "for-distribution/Digital-Habits-Blocker_${VERSION}.ipa"
          ls -la for-distribution/

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: ios-ipa
          path: for-distribution/Digital-Habits-Blocker_*.ipa
          if-no-files-found: error
          retention-days: 30

  # Partner Center submit — independent of S3 / GitHub Release so a Store API
  # outage does not block desktop distribution.
  publish-microsoft-store:
    name: Publish (Microsoft Store)
    needs: [build-windows-store]
    runs-on: windows-latest
    timeout-minutes: 60
    if: >-
      needs.build-windows-store.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.submit_microsoft_store)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Require Partner Center secrets
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
        run: |
          $missing = @()
          foreach ($name in @(
            'AZURE_AD_TENANT_ID',
            'AZURE_AD_APPLICATION_CLIENT_ID',
            'AZURE_AD_APPLICATION_SECRET',
            'SELLER_ID',
            'MS_STORE_PRODUCT_ID'
          )) {
            if (-not [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { continue }
            $missing += $name
          }
          if ($missing.Count -gt 0) {
            throw "Missing GitHub secrets for Store submit: $($missing -join ', '). See docs/microsoft-store-ci.md — set these once, or uncheck submit_microsoft_store on manual runs."
          }

      - name: Download Windows Store artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-store-packages
          path: store-packages

      - name: Resolve version
        id: meta
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog
        shell: bash
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform windows --out whats_new.txt
          echo "=== What's new ==="
          cat whats_new.txt

      - name: Setup Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Submit to Partner Center
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          MS_STORE_PRODUCT_ID: ${{ secrets.MS_STORE_PRODUCT_ID }}
          PYTHONUTF8: '1'
        run: |
          ./scripts/submit-microsoft-store.ps1 `
            -PackagesDir store-packages `
            -WhatsNewFile whats_new.txt `
            -ProductId $env:MS_STORE_PRODUCT_ID `
            -Reconfigure

  # App Store Connect submit — independent of S3 / GitHub Release, same as the
  # Microsoft Store job. Uploads the IPA, stamps iOS "What's new" from the
  # changelog (shared + iOS bullets only), and submits for review with
  # automatic release after approval.
  publish-app-store:
    name: Publish (App Store)
    needs: [build-ios]
    runs-on: macos-latest
    timeout-minutes: 120
    if: >-
      needs.build-ios.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (github.event_name == 'workflow_dispatch' && inputs.submit_app_store)
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Require App Store Connect secrets
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          missing=()
          for name in APP_STORE_CONNECT_API_KEY_ID APP_STORE_CONNECT_API_ISSUER_ID APP_STORE_CONNECT_API_KEY_P8; do
            [[ -n "${!name:-}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "Missing GitHub secrets for App Store submit: ${missing[*]}. See docs/app-store-ci.md — set these once, or uncheck submit_app_store on manual runs." >&2
            exit 1
          fi

      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: store-packages-ios

      - name: Resolve version
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build What's new from changelog (iOS)
        id: notes
        run: |
          node scripts/changelog-to-store-whats-new.js "${{ steps.meta.outputs.version }}" --platform ios --empty-ok --out whats_new_ios.txt
          if [[ -s whats_new_ios.txt ]]; then
            echo "has_notes=true" >> "$GITHUB_OUTPUT"
            echo "=== What's new (iOS) ==="
            cat whats_new_ios.txt
          else
            echo "has_notes=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No iOS-facing changelog bullets for v${{ steps.meta.outputs.version }} — skipping App Store submission."
          fi

      - name: Submit to App Store Connect
        if: steps.notes.outputs.has_notes == 'true'
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
        run: |
          IPA="$(find store-packages-ios -type f -name '*.ipa' | head -1)"
          if [[ -z "$IPA" ]]; then
            echo "No .ipa found in store-packages-ios" >&2
            exit 1
          fi
          fastlane ios submit_app_store \
            "version:${{ steps.meta.outputs.version }}" \
            "ipa:${IPA}" \
            "notes:whats_new_ios.txt"

  publish:
    name: Publish (S3 / GitHub Release)
    needs: [build-mac, build-windows, build-windows-store, build-ios]
    runs-on: ubuntu-latest
    if: >-
      needs.build-mac.result == 'success' &&
      needs.build-windows.result == 'success' &&
      needs.build-windows-store.result == 'success' &&
      needs.build-ios.result == 'success' &&
      (
        (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
        (
          github.event_name == 'workflow_dispatch' &&
          (inputs.upload_to_s3 || inputs.create_github_release)
        )
      )
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download macOS artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-installer
          path: artifacts

      - name: Download Windows artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: artifacts

      - name: Download Windows Store artifacts
        uses: actions/download-artifact@v8
        with:
          name: windows-store-packages
          path: artifacts

      - name: Download iOS artifact
        uses: actions/download-artifact@v8
        with:
          name: ios-ipa
          path: artifacts

      - name: Stage installers for publish
        run: |
          mkdir -p for-distribution
          find artifacts -type f -name 'Digital-Habits-Blocker-*.pkg' -exec cp {} for-distribution/ \;
          find artifacts -type f -name 'Digital-Habits-Blocker_*-setup.exe' -exec cp {} for-distribution/ \;
          find artifacts -type f -name 'Digital-Habits-Blocker_*.msix' -exec cp {} for-distribution/ \;
          find artifacts -type f -name 'Digital-Habits-Blocker_*.ipa' -exec cp {} for-distribution/ \;
          echo "Staged installers:"
          ls -la for-distribution/

      - name: Resolve version and tag
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${{ github.event_name }}" == "push" ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v${VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${TAG}" != "v${VERSION}" ]]; then
            echo "Tag ${TAG} does not match package.json version v${VERSION}" >&2
            exit 1
          fi

      - name: Update latest-versions.json macOS checksum
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
        run: |
          PKG="$(find for-distribution -maxdepth 1 -name 'Digital-Habits-Blocker-*.pkg' | head -1)"
          if [[ -z "$PKG" ]]; then
            echo "No macOS .pkg found in for-distribution" >&2
            exit 1
          fi
          node scripts/update-latest-versions-json.js \
            --version "${{ steps.meta.outputs.version }}" \
            --macos-pkg "$PKG"

      - name: Commit latest-versions.json
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Builds can take a while; main often moves ahead of the checkout SHA.
          # Re-apply the updated file on tip of main, then push (retry once if raced).
          cp docs/latest-versions.json /tmp/latest-versions.json
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/latest-versions.json docs/latest-versions.json

          git add docs/latest-versions.json
          if git diff --staged --quiet; then
            echo "latest-versions.json already up to date"
            exit 0
          fi
          git commit -m "Update latest-versions.json for v${{ steps.meta.outputs.version }}"
          if ! git push origin HEAD:refs/heads/main; then
            git pull --rebase origin main
            git push origin HEAD:refs/heads/main
          fi

      - name: Configure AWS credentials
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_s3)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload installers to S3
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.upload_to_s3)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bash ./scripts/upload-release-to-s3.sh all

      - name: Extract release notes from changelog
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
        run: |
          bash ./scripts/extract-changelog-section.sh "${{ steps.meta.outputs.version }}" > release-notes.md
          echo "Release notes:"
          cat release-notes.md

      - name: Create GitHub Release
        if: >-
          (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
          (github.event_name == 'workflow_dispatch' && inputs.create_github_release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "Digital Habits: Blocker v${{ steps.meta.outputs.version }}"
          body_path: release-notes.md
          files: |
            for-distribution/Digital-Habits-Blocker-*.pkg
            for-distribution/Digital-Habits-Blocker_*-setup.exe
            for-distribution/Digital-Habits-Blocker_*.msix
            for-distribution/Digital-Habits-Blocker_*.ipa
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: false
          fail_on_unmatched_files: true
