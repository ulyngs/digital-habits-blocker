# Run the Rust unit tests (`src-tauri/src/**/#[cfg(test)]`) on PRs that touch
# the backend, and on the resulting commits on main. Kept out of ci.yml so
# frontend-only PRs do not pay for a macOS runner, mirroring how android-ci.yml
# isolates the Android toolchain.
#
# macOS is the only host that compiles every tested module: `web_automation`,
# `window_inventory` and `workspace_events` are `#[cfg(target_os = "macos")]`,
# and the `cfg(not(ios|android))` modules pull macOS/Windows-only dependencies
# (sysinfo, tauri-plugin-notification), so a Linux runner cannot build the lib
# at all. No Windows-only module carries tests, so macOS covers the whole suite.
name: Rust CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/build-safari-bridge.sh'
      - '.github/workflows/rust-ci.yml'
  # Duplicated rather than anchored — GitHub Actions does not support YAML
  # aliases. Keep the two lists in sync.
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/build-safari-bridge.sh'
      - '.github/workflows/rust-ci.yml'

concurrency:
  group: rust-ci-${{ github.ref }}
  # See ci.yml: superseded PR runs are wasted work, but every main commit should
  # get its own verdict.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  rust:
    name: Rust unit tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # `tauri_build::build()` (invoked from src-tauri/build.rs) validates that
      # the configured frontendDist — ../dist — exists, so the lib does not
      # compile on a clean checkout until the frontend has been built once.
      - run: npm run vite:build
      # `--lib` on purpose: bare `cargo test` also compiles the stale
      # `test_watcher` example binary, which no longer builds (see testing.md).
      # build.rs compiles the Swift SafariServices bridge first; macOS runners
      # ship the Xcode toolchain it needs.
      - name: cargo test --lib
        working-directory: src-tauri
        run: cargo test --lib

  # Static analysis for the desktop enforcement engine. The Android job's
  # clippy run compiles out everything gated `cfg(not(any(ios, android)))` —
  # app_watcher, enforcer, native_host, profile_scan — plus every macOS- and
  # Windows-only module, so roughly 60% of src-tauri/src had no lint coverage
  # at all until this job existed.
  #
  # Both hosts, because the two see genuinely different code: most of the
  # dead-code and cfg-dispatch findings here are live on one platform and dead
  # on the other, and a macOS-only gate would demand deleting Windows code.
  # There is no Linux entry — the lib does not compile there (see the header).
  clippy:
    name: Clippy (desktop, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: clippy-${{ matrix.os }}
      - run: pnpm install --frozen-lockfile
      # Same reason as the test job: build.rs validates that ../dist exists.
      - run: pnpm vite:build
      # `--lib` matches the Android clippy invocation and skips the stale
      # `test_watcher` example.
      - name: cargo clippy --lib
        working-directory: src-tauri
        run: cargo clippy --lib -- -D warnings
