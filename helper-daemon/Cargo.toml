[package]
name = "redd-block-helper"
version = "1.0.0"
edition = "2021"
description = "ReDD Block Helper Daemon - manages hosts file blocking"

[dependencies]
redd-block-core = { path = "../redd-block-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11"
dirs = "6.0"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"
