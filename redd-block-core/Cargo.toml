[package]
name = "redd-block-core"
version = "0.1.0"
edition = "2021"
description = "Shared blocklist, browser-probing and enforcement types for ReDD Block (Tauri app + helper daemon)."
license = "CC-BY-NC-ND-3.0"

[lib]
name = "redd_block_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

# Path utilities. Pinned loosely enough that both the Tauri app (dirs = "5")
# and the helper daemon (dirs = "6") can continue to pin their own versions
# — we only need `home_dir()`/`data_dir()` which are stable across these
# releases.
dirs = "5"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"
