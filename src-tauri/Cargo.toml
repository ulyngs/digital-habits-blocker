[package]
name = "redd-block"
version = "1.0.1"
description = "ReDD Block - block distracting websites and apps to stay focused"
authors = ["The Reduce Digital Distraction Project <team@reddfocus.org>"]
license = "CC-BY-NC-ND-3.0"
repository = "https://github.com/ulyngs/redd-block"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "redd_block_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
desktop = ["tauri/tray-icon"]

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "5"
lazy_static = "1.5"
tauri-plugin-opener = "2.5.0"
tauri-plugin-notification = "2"
notify = "8"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"

[target.'cfg(not(target_os = "windows"))'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-screentime = { path = "../tauri-plugin-screentime" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_Security",
] }
