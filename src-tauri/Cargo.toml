[package]
name = "redd-block"
version = "3.8.7"
description = "Digital Habits: Blocker"
authors = ["Centre for Digital Habits <team@digitalhabits.org>"]
license = "CC-BY-NC-ND-3.0"
repository = "https://github.com/ulyngs/redd-block"
edition = "2021"
rust-version = "1.77.2"

# Keep development builds debuggable while avoiding full DWARF data for every
# dependency. Release builds retain Cargo's non-incremental, no-debug-info defaults.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 1

[profile.release]
incremental = false

[lib]
name = "redd_block_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
desktop = ["tauri/tray-icon"]

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "5"
lazy_static = "1.5"
tauri-plugin-opener = "2.5.0"
dotenvy = "0.15"

[dev-dependencies]
env_logger = "0.11"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError", "NSFileManager", "NSString", "NSURL"] }
plist = "1"
# NSPanel-backed main window: lets the blocking-warning shell adopt
# `NSWindowStyleMaskNonactivatingPanel` + `FullScreenAuxiliary` collection
# behavior during the countdown so it floats above third-party fullscreen
# windows without stealing focus — same machinery redd-do uses for its
# pop-out focus panel.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-screentime = { path = "../tauri-plugin-screentime" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-blocker = { path = "../tauri-plugin-android-blocker" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Time",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
sysinfo = "0.33"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
sha2 = "0.10"
# Single-instance enforcement so the NSIS post-install hook (which always
# launches redd-block.exe) and the optional finish-page "Run" checkbox
# can't produce two running instances. Also benefits day-to-day usage —
# clicking the app icon while already running focuses the existing
# window instead of launching a duplicate.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
