[package]
name = "redd-block"
version = "3.8.9"
description = "Digital Habits: Blocker"
authors = ["Centre for Digital Habits <team@digitalhabits.org>"]
license = "CC-BY-NC-ND-3.0"
repository = "https://github.com/ulyngs/digital-habits-blocker"
edition = "2021"
rust-version = "1.77.2"

# Keep development builds debuggable while avoiding full DWARF data for every
# dependency. Release builds retain Cargo's non-incremental, no-debug-info defaults.
[profile.dev]
debug = 1
incremental = true

[profile.dev.package."*"]
debug = 1

[profile.release]
incremental = false

[lib]
name = "redd_block_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# The `objc` crate's `msg_send!` macro still expands to a
# `#[cfg(feature = "cargo-clippy")]` guard, which this crate does not (and
# should not) declare. Without this, every macOS FFI call site emits an
# `unexpected_cfgs` warning — 64 of them — which would drown a `-D warnings`
# clippy gate in noise from a dependency we don't control.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(feature, values("cargo-clippy"))',
] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
desktop = ["tauri/tray-icon"]
# Compiles an embedded WebDriver server into the binary so the Tier 2 e2e suite
# can drive a real app on macOS (where `tauri-driver` has no WKWebView driver).
#
# NEVER enable this for anything a user runs. The server exposes automation
# over HTTP on localhost — in a blocker app that is a remote-control bypass of
# the thing the app exists to enforce. It is deliberately an explicit opt-in
# feature rather than the crate's documented `#[cfg(debug_assertions)]` gate,
# which would open the port on every `npm run dev` session. `lib.rs` also
# hard-fails the build if this is ever combined with a release profile.
e2e-webdriver = ["dep:tauri-plugin-wdio-webdriver"]

[dependencies]
tauri = { version = "2.11", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2.7"
tauri-plugin-fs = "2.5"
tauri-plugin-shell = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
dirs = "5"
lazy_static = "1.5"
tauri-plugin-opener = "2.5.4"
dotenvy = "0.15"

[dev-dependencies]
env_logger = "0.11"

# Test-only, opt-in via the `e2e-webdriver` feature. Not a dev-dependency:
# the binary under test is a real `tauri build`, and dev-dependencies do not
# apply to that. See the feature comment above for why it must never ship.
[dependencies.tauri-plugin-wdio-webdriver]
version = "1.3"
optional = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
core-foundation = "0.10.1"
core-graphics = "0.25.0"
objc = "0.2"
objc2-foundation = { version = "0.3", default-features = false, features = ["NSError", "NSFileManager", "NSString", "NSURL"] }
plist = "1"
# NSPanel-backed main window: lets the blocking-warning shell adopt
# `NSWindowStyleMaskNonactivatingPanel` + `FullScreenAuxiliary` collection
# behavior during the countdown so it floats above third-party fullscreen
# windows without stealing focus — same machinery redd-do uses for its
# pop-out focus panel.
tauri-nspanel = { git = "https://github.com/ahkohd/tauri-nspanel", branch = "v2.1" }

[target.'cfg(target_os = "ios")'.dependencies]
tauri-plugin-screentime = { path = "../tauri-plugin-screentime" }

[target.'cfg(target_os = "android")'.dependencies]
tauri-plugin-android-blocker = { path = "../tauri-plugin-android-blocker" }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.61", features = [
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Registry",
  "Win32_System_LibraryLoader",
  "Win32_System_ProcessStatus",
  "Win32_System_Time",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Com",
  "Win32_Storage_FileSystem",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
sysinfo = "0.33"
tauri-plugin-notification = "2"

[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util"] }
sha2 = "0.10"
# Single-instance enforcement so the NSIS post-install hook (which always
# launches redd-block.exe) and the optional finish-page "Run" checkbox
# can't produce two running instances. Also benefits day-to-day usage —
# clicking the app icon while already running focuses the existing
# window instead of launching a duplicate.
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
