[package]
name = "tauri-plugin-android-blocker"
version = "0.1.0"
authors = [ "You" ]
description = "Thin Rust bridge to the Kotlin AccessibilityService that powers app/website blocking on Android"
edition = "2021"
rust-version = "1.77.2"
exclude = ["/examples", "/dist-js", "/guest-js", "/node_modules"]
links = "tauri-plugin-android-blocker"

[dependencies]
tauri = { version = "2.9.5" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
tauri-plugin = { version = "2.5.2", features = ["build"] }
