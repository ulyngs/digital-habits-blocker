# Robolectric emulates a fixed API level rather than following compileSdk.
# Pinning keeps the suite from breaking (and from downloading a new android-all
# jar) every time compileSdk moves, and keeps CI runs reproducible.
#
# 34 is comfortably above the app's minSdk 26 and is a level this Robolectric
# release ships a runtime for.
sdk=34
